name: Bootstrap candidate checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unprivileged-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: |
          bash -n bootstrap.sh
          bash -n legacy/bootstrap.sh
          bash -n install.sh
          bash -n templates/access-helper.sh
      - name: Run guard and documentation regression tests
        run: /usr/bin/python3 -B -m unittest discover -s tests -v
      - name: Check whitespace
        run: git show --format= --check HEAD
  controller-syntax-and-templates:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify pinned tooling, syntax, and templates (never apply)
        run: python3 -B scripts/check_playbooks.py --tooling-dir "$RUNNER_TEMP/lab-controller"
      - name: Build candidate package, not a production release
        run: python3 -B scripts/build_candidate.py --output "$RUNNER_TEMP/lab-candidate"
      - name: Retain source-only candidate and SHA256 (not a production release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bootstrap-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/lab-candidate/
          if-no-files-found: error
          retention-days: 30
